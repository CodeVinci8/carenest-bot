[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carenest-bot"
dynamic = ["version"]
description = "Персональный Telegram-бот о заботе и внимании"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.22,<4",
    "APScheduler>=3.11,<4",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
carenest = "carenest.cli:main"

[tool.setuptools.packages.find]
include = ["carenest*"]

[tool.setuptools.dynamic]
version = {attr = "carenest.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
